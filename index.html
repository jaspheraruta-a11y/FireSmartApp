
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fire Smart - IoT Fire Response System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet for maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    
  <style>
    /* Custom futuristic scrollbar and base styles */
    :root {
      --primary-red: #E53935;
      --flame-orange: #FB8C00;
      --fire-yellow: #FDD835;
      --charcoal-black: #0F0F0F;
      --steel-gray: #2A2A2A;
      --metal-silver: #CFCFCF;
      --emergency-green: #43A047;
    }

    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background-color: var(--charcoal-black);
      color: var(--metal-silver);
    }
    #root {
      height: 100%;
      min-height: 100%;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--charcoal-black);
    }
    ::-webkit-scrollbar-thumb {
      background-color: var(--steel-gray);
      border-radius: 10px;
      border: 2px solid var(--charcoal-black);
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--primary-red);
    }

    /* Keyframes for animations */
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(229, 57, 53, 0); }
    }
    @keyframes pulse-yellow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(253, 216, 53, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(253, 216, 53, 0); }
    }
     @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .pulse-red-animation {
      animation: pulse-red 2s infinite;
    }
    /* Red pinpoint blinker for active fire alerts on map */
    @keyframes pinpoint-blinker-red {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.9); }
      50% { opacity: 0.85; transform: scale(1.1); box-shadow: 0 0 0 12px rgba(229, 57, 53, 0); }
    }
    .pinpoint-blinker-red {
      animation: pinpoint-blinker-red 1.2s ease-in-out infinite;
    }
    .pulse-yellow-animation {
        animation: pulse-yellow 2s infinite;
    }
    .pulse-green-animation {
        animation: pulse-green 1.5s ease-in-out infinite;
    }

    /* Custom glow effects */
    .glow-red {
      box-shadow: 0 0 5px var(--primary-red), 0 0 10px var(--primary-red), 0 0 15px var(--primary-red);
    }
    .glow-orange {
      box-shadow: 0 0 5px var(--flame-orange), 0 0 10px var(--flame-orange), 0 0 15px var(--flame-orange);
    }
    .glow-yellow {
      box-shadow: 0 0 5px var(--fire-yellow), 0 0 10px var(--fire-yellow), 0 0 15px var(--fire-yellow);
    }

    /* ══════════════════════════════════
       FUTURISTIC MAP UI STYLES
       ══════════════════════════════════ */

    /* ─── Keyframes ─── */
    @keyframes fire-halo-pulse {
      0%   { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2); opacity: 0; }
    }
    @keyframes fire-glow-pulse {
      0%, 100% { box-shadow: 0 0 10px var(--accent), 0 0 22px var(--accent); }
      50%      { box-shadow: 0 0 16px var(--accent), 0 0 34px var(--accent); }
    }
    @keyframes neon-pulse-yellow-anim {
      0%,100% { transform:scale(1); box-shadow:0 0 0 0 rgba(253,216,53,0.8); }
      50%      { transform:scale(1.12); box-shadow:0 0 0 12px rgba(253,216,53,0); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -30; }
    }
    @keyframes fade-in-up {
      from { opacity:0; transform:translateY(12px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes slide-in-right {
      from { opacity:0; transform:translateX(16px); }
      to   { opacity:1; transform:translateX(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes truck-glow {
      0%,100% { filter: drop-shadow(0 0 4px #00ffff) drop-shadow(0 0 8px #00d4ff); }
      50%      { filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 20px #a855f7); }
    }
    @keyframes loading-ring {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes bfp-pulse {
      0%,100% { opacity:0.6; transform:scale(1); }
      50%      { opacity:0; transform:scale(2); }
    }

    /* ─── Marker styles ─── */
    .fire-marker-wrapper {
      position: relative;
      width: 44px;
      height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
    }
    .fire-marker-halo {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      opacity: 0.8;
      animation: fire-halo-pulse 1.8s ease-out infinite;
      transform-origin: center;
    }
    .fire-marker-circle {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, var(--accent) 0%, var(--accent) 68%, rgba(0,0,0,0) 100%);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fire-glow-pulse 1.4s ease-in-out infinite;
      cursor: pointer;
      z-index: 2;
      pointer-events: auto;
    }
    .fire-marker-flame {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
    }
    .fire-marker-pin {
      width: 0;
      height: 0;
      margin-top: -1px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 10px solid var(--accent);
      filter: drop-shadow(0 0 6px var(--accent));
    }

    /* ─── BFP Marker ─── */
    .bfp-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .bfp-marker-glow {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,212,255,0.3);
      animation: bfp-pulse 2s ease-out infinite;
    }
    .bfp-marker-inner {
      position: relative;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #0f2a3f, #0a1628);
      border: 2px solid #00d4ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0,212,255,0.6), 0 0 24px rgba(0,212,255,0.25);
      z-index: 2;
    }
    .bfp-marker-label {
      position: relative;
      background: rgba(0,212,255,0.12);
      border: 1px solid rgba(0,212,255,0.5);
      color: #00d4ff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 0 8px rgba(0,212,255,0.3);
      z-index: 2;
    }

    /* ─── Glowing solid circles (moving route indicators) ─── */
    @keyframes circle-pulse {
      0%,100% { transform: scale(1);   }
      50%      { transform: scale(1.35); }
    }
    .glow-circle-dot {
      border-radius: 50%;
      animation: circle-pulse 1.6s ease-in-out infinite;
      pointer-events: none;
    }

    /* ─── Loading Spinner ─── */
    .map-loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .map-loading-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0,212,255,0.15);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: loading-ring 0.9s linear infinite;
    }
    .map-loading-text {
      font-size: 13px;
      color: #00d4ff;
      letter-spacing: 1px;
      font-weight: 600;
      text-shadow: 0 0 8px #00d4ff;
    }

    /* ─── Zoom Controls ─── */
    .map-zoom-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      background: rgba(10,15,30,0.85);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 12px rgba(0,212,255,0.1);
      overflow: hidden;
    }
    .map-zoom-btn {
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      color: #00d4ff;
      font-size: 20px;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }
    .map-zoom-btn:hover {
      background: rgba(0,212,255,0.15);
      color: #fff;
    }
    .map-zoom-divider {
      height: 1px;
      background: rgba(0,212,255,0.2);
      margin: 0 6px;
    }

    /* ─── Route Panel ─── */
    .map-route-panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 500;
      width: 240px;
      max-height: 220px;
      background: rgba(8,12,22,0.92);
      border: 1px solid rgba(0,212,255,0.25);
      border-radius: 12px;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 16px rgba(0,212,255,0.08);
      overflow: hidden;
      animation: slide-in-right 0.4s ease;
    }
    .map-route-panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(0,212,255,0.07);
      border-bottom: 1px solid rgba(0,212,255,0.18);
      font-size: 12px;
      font-weight: 700;
      color: #00d4ff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .map-route-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
      animation: neon-pulse-yellow-anim 1.4s infinite;
      margin-left: auto;
    }
    .map-route-list {
      list-style: none;
      margin: 0;
      padding: 6px;
      overflow-y: auto;
      max-height: 160px;
    }
    .map-route-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 2px;
    }
    .map-route-item:hover {
      background: rgba(0,212,255,0.08);
    }
    .map-route-item-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .map-route-item-content { flex: 1; min-width: 0; }
    .map-route-item-addr {
      font-size: 11px;
      color: #e2e8f0;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .map-route-item-stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .map-stat {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .map-stat.blue { color: #60a5fa; background: rgba(96,165,250,0.12); }
    .map-stat.green { color: #4ade80; background: rgba(74,222,128,0.12); }
    .map-route-calculating {
      font-size: 10px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .map-route-spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(100,116,139,0.3);
      border-top-color: #64748b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ─── Incident Detail Popup ─── */
    .map-popup-overlay {
      position: absolute;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      padding: 16px;
      animation: fade-in-up 0.25s ease;
    }
    .map-popup {
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      background: rgba(8,14,28,0.97);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.8), 0 0 40px rgba(0,212,255,0.1);
      animation: fade-in-up 0.3s ease;
    }
    .map-popup-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(0,212,255,0.15);
      background: linear-gradient(135deg, rgba(0,212,255,0.06), rgba(168,85,247,0.06));
    }
    .map-popup-title {
      font-size: 17px;
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: 0.3px;
    }
    .map-popup-id {
      font-size: 11px;
      color: #475569;
      margin-top: 2px;
      font-family: monospace;
    }
    .map-popup-close {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .map-popup-close:hover { background: rgba(239,68,68,0.2); color: #f87171; border-color: rgba(239,68,68,0.4); }

    .map-popup-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .map-popup-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .map-popup-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    @media (max-width:480px) {
      .map-popup-grid-2, .map-popup-grid-3 { grid-template-columns: 1fr; }
    }
    .map-popup-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .map-popup-card-label { font-size: 11px; color: #64748b; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .map-popup-card-value { font-size: 14px; color: #e2e8f0; font-weight: 700; }
    .map-popup-card-value.text-red { color: #f87171; }
    .map-popup-card-value.text-yellow { color: #fbbf24; }
    .map-popup-card-value.text-cyan { color: #22d3ee; }
    .map-popup-card-value.text-blue { color: #60a5fa; }
    .map-popup-card-value.text-green { color: #4ade80; }

    .map-popup-route-card {
      background: rgba(0,212,255,0.05);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 10px;
      padding: 12px;
    }
    .map-popup-route-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #00d4ff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .map-popup-sensor {
      background: rgba(168,85,247,0.05);
      border: 1px solid rgba(168,85,247,0.2);
      border-radius: 10px;
      padding: 12px;
    }
    .map-sensor-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }

    /* ─── Legend ─── */
    .map-legend {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 500;
      background: rgba(8,12,22,0.88);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      animation: fade-in-up 0.4s ease;
    }
    .map-legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    .map-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ─── Truck Dot Icon ─── */
    @keyframes truck-ring-expand {
      0%   { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    .truck-dot-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }
    .truck-dist-badge {
      background: rgba(59,130,246,0.92);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid rgba(147,197,253,0.7);
      box-shadow: 0 0 8px rgba(59,130,246,0.8), 0 2px 6px rgba(0,0,0,0.5);
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .truck-dot-core {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .truck-dot-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(59,130,246,0.5);
      animation: truck-ring-expand 2.4s ease-out infinite;
    }
    .truck-dot-pulse-1 { animation-delay: 0s; }
    .truck-dot-pulse-2 { animation-delay: 0.8s; }
    .truck-dot-pulse-3 { animation-delay: 1.6s; }
    .truck-dot-center {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      border: 2.5px solid #93c5fd;
      box-shadow: 0 0 10px #3b82f6, 0 0 20px rgba(59,130,246,0.5);
      z-index: 2;
    }

    /* ─── Leaflet overrides for dark theme ─── */
    .leaflet-container {
      font-family: inherit;
    }
    .leaflet-control-attribution {
      background: rgba(8,12,22,0.7) !important;
      color: #475569 !important;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: #00d4ff !important; }
  </style>
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
